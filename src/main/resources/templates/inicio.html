<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Início</title>

    <th:block th:replace="~{fragments/recursos :: recursos}"></th:block>
</head>

<body>

<div class="container py-5">

    <div class="painel-topo mb-5">

        <div>
            <span class="painel-etiqueta">
                Sistema de Login Seguro
            </span>

            <h1 class="mt-3">
                Bem-vindo
            </h1>

            <p class="mb-0">
                Você está conectado como
                <strong sec:authentication="name"></strong>
            </p>
        </div>

        <form th:action="@{/logout}" method="post">

            <button
                type="submit"
                class="btn btn-sair">

                <i class="bi bi-box-arrow-right"></i>
                Sair

            </button>

        </form>

    </div>

    <div class="row g-4">

        <div
            class="col-md-6 col-lg-4"
            sec:authorize="hasAnyRole('USUARIO', 'MODERADOR', 'ADMIN')">

            <a
                href="/usuario"
                class="card-acesso">

                <div class="icone-acesso icone-usuario">
                    <i class="bi bi-person"></i>
                </div>

                <div>

                    <h3>
                        Área do Usuário
                    </h3>

                    <p>
                        Acesse as funcionalidades disponíveis para sua conta.
                    </p>

                </div>

                <i class="bi bi-arrow-right seta-card"></i>

            </a>

        </div>

        <div
            class="col-md-6 col-lg-4"
            sec:authorize="hasAnyRole('MODERADOR', 'ADMIN')">

            <a
                href="/moderador"
                class="card-acesso">

                <div class="icone-acesso icone-moderador">
                    <i class="bi bi-shield-check"></i>
                </div>

                <div>

                    <h3>
                        Área do Moderador
                    </h3>

                    <p>
                        Acesse as funções disponíveis para moderação.
                    </p>

                </div>

                <i class="bi bi-arrow-right seta-card"></i>

            </a>

        </div>

        <div
            class="col-md-6 col-lg-4"
            sec:authorize="hasRole('ADMIN')">

            <a
                href="/admin"
                class="card-acesso">

                <div class="icone-acesso icone-admin">
                    <i class="bi bi-gear"></i>
                </div>

                <div>

                    <h3>
                        Administração
                    </h3>

                    <p>
                        Gerencie usuários, perfis e acessos do sistema.
                    </p>

                </div>

                <i class="bi bi-arrow-right seta-card"></i>

            </a>

        </div>

    </div>

</div>

</body>
</html>
