<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área Administrativa</title>

    <th:block th:replace="~{fragments/recursos :: recursos}"></th:block>
</head>

<body>

<div class="container py-5">

    <div class="painel-topo mb-5">

        <div>

            <span class="painel-etiqueta">
                Administração
            </span>

            <h1 class="mt-3">
                Área Administrativa
            </h1>

            <p class="mb-0">
                Administrador:
                <strong th:text="${email}"></strong>
            </p>

        </div>

        <a
            href="/inicio"
            class="btn btn-sair">

            <i class="bi bi-arrow-left"></i>
            Voltar

        </a>

    </div>

    <div class="row">

        <div class="col-md-6 col-lg-4">

            <a
                href="/admin/usuarios"
                class="card-acesso">

                <div class="icone-acesso icone-admin">
                    <i class="bi bi-people"></i>
                </div>

                <div>

                    <h3>
                        Gerenciar usuários
                    </h3>

                    <p>
                        Altere perfis, status e permissões dos usuários cadastrados.
                    </p>

                </div>

                <i class="bi bi-arrow-right seta-card"></i>

            </a>

        </div>

    </div>

</div>

</body>
</html>
