<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <th:block th:replace="~{fragments/recursos :: recursos}"></th:block>
</head>
<body>

<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-md-6 col-lg-5">

            <div class="card login-card">

                <div class="card-body p-4">

                    <div class="login-icone">
                        <i class="bi bi-person-plus"></i>
                    </div>

                    <h2 class="text-center mt-3 mb-2">
                        Criar conta
                    </h2>

                    <p class="text-center mb-4">
                        Preencha os dados para realizar seu cadastro.
                    </p>

                    <div
                        class="alert alert-danger"
                        th:if="${erro}"
                        th:text="${erro}">
                    </div>

                    <form
                        th:action="@{/cadastro}"
                        th:object="${cadastroUsuario}"
                        method="post">

                        <div class="mb-3">

                            <label
                                for="nome"
                                class="form-label">
                                Nome
                            </label>

                            <input
                                type="text"
                                id="nome"
                                class="form-control"
                                placeholder="Digite seu nome"
                                th:field="*{nome}"
                                th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">

                            <div
                                class="invalid-feedback"
                                th:errors="*{nome}">
                            </div>

                        </div>

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label">
                                E-mail
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="seu@email.com"
                                th:field="*{email}"
                                th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">

                            <div
                                class="invalid-feedback"
                                th:errors="*{email}">
                            </div>

                        </div>

                        <div class="mb-3">

                            <label
                                for="senha"
                                class="form-label">
                                Senha
                            </label>

                            <div class="input-group">

                                <input
                                    type="password"
                                    id="senha"
                                    class="form-control"
                                    placeholder="Digite sua senha"
                                    th:field="*{senha}"
                                    th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'">

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="alternarSenha('senha', 'iconeSenha')">

                                    <i
                                        id="iconeSenha"
                                        class="bi bi-eye">
                                    </i>

                                </button>

                            </div>

                            <div
                                class="invalid-feedback d-block"
                                th:if="${#fields.hasErrors('senha')}"
                                th:errors="*{senha}">
                            </div>

                        </div>

                        <div class="mb-4">

                            <label
                                for="confirmarSenha"
                                class="form-label">
                                Confirmar senha
                            </label>

                            <div class="input-group">

                                <input
                                    type="password"
                                    id="confirmarSenha"
                                    class="form-control"
                                    placeholder="Digite a senha novamente"
                                    th:field="*{confirmarSenha}"
                                    th:classappend="${#fields.hasErrors('confirmarSenha')} ? 'is-invalid'">

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="alternarSenha('confirmarSenha', 'iconeConfirmarSenha')">

                                    <i
                                        id="iconeConfirmarSenha"
                                        class="bi bi-eye">
                                    </i>

                                </button>

                            </div>

                            <div
                                class="invalid-feedback d-block"
                                th:if="${#fields.hasErrors('confirmarSenha')}"
                                th:errors="*{confirmarSenha}">
                            </div>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            <i class="bi bi-person-check"></i>
                            Cadastrar

                        </button>

                    </form>

                    <p class="text-center mt-4 mb-0">
                        Já possui uma conta?

                        <a
                            th:href="@{/login}"
                            class="link-principal">
                            Entrar
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

<script>
    function alternarSenha(campoId, iconeId) {
        const campo = document.getElementById(campoId);
        const icone = document.getElementById(iconeId);

        if (campo.type === "password") {
            campo.type = "text";
            icone.className = "bi bi-eye-slash";
        } else {
            campo.type = "password";
            icone.className = "bi bi-eye";
        }
    }
</script>

</body>
</html>
