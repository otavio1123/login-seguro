<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área do Usuário</title>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área do Usuário</title>

    <th:block th:replace="~{fragments/recursos :: recursos}"></th:block>
</head>

<body>

<div class="container py-5">

    <div class="painel-topo mb-5">

        <div>

            <span class="painel-etiqueta">
                Usuário
            </span>

            <h1 class="mt-3">
                Área do Usuário
            </h1>

            <p class="mb-0">
                Usuário autenticado:
                <strong th:text="${email}"></strong>
            </p>

        </div>

        <a
            href="/inicio"
            class="btn btn-sair">

            <i class="bi bi-arrow-left"></i>
            Voltar

        </a>

    </div>

    <div class="row">

        <div class="col-md-6 col-lg-4">

            <div class="card-acesso">

                <div class="icone-acesso icone-usuario">
                    <i class="bi bi-person"></i>
                </div>

                <div>

                    <h3>
                        Acesso liberado
                    </h3>

                    <p>
                        Esta área está disponível para usuários autenticados no sistema.
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
