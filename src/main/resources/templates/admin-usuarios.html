<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciar usuários</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1>Gerenciar usuários</h1>
            <p class="text-muted mb-0">
                Altere o perfil e o status dos usuários cadastrados.
            </p>
        </div>

        <a href="/admin" class="btn btn-secondary">
            Voltar
        </a>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Perfil atual</th>
                        <th>Status</th>
                        <th>Alterar perfil</th>
                        <th>Ação</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="usuario : ${usuarios}">

                        <td th:text="${usuario.nome}">
                            Nome
                        </td>

                        <td th:text="${usuario.email}">
                            email@email.com
                        </td>

                        <td>
                            <span
                                class="badge text-bg-primary"
                                th:each="perfil : ${usuario.perfis}"
                                th:text="${perfil}">
                                USUARIO
                            </span>
                        </td>

                        <td>

                            <span
                                th:if="${usuario.ativo}"
                                class="badge text-bg-success">
                                Ativo
                            </span>

                            <span
                                th:unless="${usuario.ativo}"
                                class="badge text-bg-danger">
                                Inativo
                            </span>

                        </td>

                        <td>

                            <form
                                th:action="@{/admin/usuarios/{id}/perfil(id=${usuario.id})}"
                                method="post"
                                class="d-flex gap-2">

                                <select
                                    name="perfil"
                                    class="form-select">

                                    <option
                                        th:each="perfil : ${perfis}"
                                        th:value="${perfil}"
                                        th:text="${perfil}"
                                        th:selected="${usuario.perfis.contains(perfil)}">
                                    </option>

                                </select>

                                <button
                                    type="submit"
                                    class="btn btn-primary">
                                    Salvar
                                </button>

                            </form>

                        </td>

                        <td>

                            <form
                                th:action="@{/admin/usuarios/{id}/status(id=${usuario.id})}"
                                method="post">

                                <button
                                    th:if="${usuario.ativo}"
                                    type="submit"
                                    class="btn btn-outline-danger">
                                    Desativar
                                </button>

                                <button
                                    th:unless="${usuario.ativo}"
                                    type="submit"
                                    class="btn btn-outline-success">
                                    Ativar
                                </button>

                            </form>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
