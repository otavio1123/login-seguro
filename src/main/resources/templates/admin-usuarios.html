<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciar usuários</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        rel="stylesheet"
        th:href="@{/css/estilo.css}">
</head>

<body>

<div class="container py-5">

    <div class="painel-topo mb-4">

        <div>

            <span class="painel-etiqueta">
                Administração
            </span>

            <h1 class="mt-3">
                Gerenciar usuários
            </h1>

            <p class="mb-0">
                Altere o perfil e o status dos usuários cadastrados.
            </p>

        </div>

        <a
            href="/admin"
            class="btn btn-sair">

            <i class="bi bi-arrow-left"></i>
            Voltar

        </a>

    </div>

    <div
        class="alert alert-danger"
        th:if="${erro}"
        th:text="${erro}">
    </div>

    <div class="card">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>

                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Perfil</th>
                        <th>Status</th>
                        <th>Alterar perfil</th>
                        <th>Ação</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="usuario : ${usuarios}">

                        <td th:text="${usuario.nome}">
                            Nome
                        </td>

                        <td th:text="${usuario.email}">
                            email@email.com
                        </td>

                        <td>

                            <span
                                class="badge text-bg-primary"
                                th:each="perfil : ${usuario.perfis}"
                                th:text="${perfil}">
                                USUARIO
                            </span>

                        </td>

                        <td>

                            <span
                                th:if="${usuario.ativo}"
                                class="badge text-bg-success">
                                Ativo
                            </span>

                            <span
                                th:unless="${usuario.ativo}"
                                class="badge text-bg-danger">
                                Inativo
                            </span>

                        </td>

                        <td>

                            <form
                                th:action="@{/admin/usuarios/{id}/perfil(id=${usuario.id})}"
                                method="post"
                                class="d-flex gap-2">

                                <select
                                    name="perfil"
                                    class="form-select">

                                    <option
                                        th:each="perfil : ${perfis}"
                                        th:value="${perfil}"
                                        th:text="${perfil}"
                                        th:selected="${usuario.perfis.contains(perfil)}">
                                    </option>

                                </select>

                                <button
                                    type="submit"
                                    class="btn btn-primary">

                                    <i class="bi bi-check-lg"></i>
                                    Salvar

                                </button>

                            </form>

                        </td>

                        <td>

                            <form
                                th:action="@{/admin/usuarios/{id}/status(id=${usuario.id})}"
                                method="post">

                                <button
                                    th:if="${usuario.ativo}"
                                    type="submit"
                                    class="btn btn-outline-danger">

                                    <i class="bi bi-person-x"></i>
                                    Desativar

                                </button>

                                <button
                                    th:unless="${usuario.ativo}"
                                    type="submit"
                                    class="btn btn-outline-success">

                                    <i class="bi bi-person-check"></i>
                                    Ativar

                                </button>

                            </form>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
